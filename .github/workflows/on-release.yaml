---
name: On Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  publish-chart:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Resolve chart version from release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "CHART_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set chart version
        run: |
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/buildkit/Chart.yaml

      - name: Package chart
        run: helm package charts/buildkit --destination dist

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push OCI chart
        run: |
          helm push "dist/buildkit-helm-${{ env.CHART_VERSION }}.tgz" oci://ghcr.io/builderhub

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-buildkit-helm-${{ env.CHART_VERSION }}
          path: dist/buildkit-helm-${{ env.CHART_VERSION }}.tgz
