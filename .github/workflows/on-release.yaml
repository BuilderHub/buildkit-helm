---
name: On Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version (semver, e.g. 0.1.0)
        required: true
      push:
        description: Push chart to GHCR OCI registry
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  publish-chart:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set chart version
        run: |
          sed -i "s/^version:.*/version: ${{ inputs.version }}/" charts/buildkit/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ inputs.version }}\"/" charts/buildkit/Chart.yaml

      - name: Package chart
        run: helm package charts/buildkit --destination dist

      - name: Login to GHCR
        if: inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push OCI chart
        if: inputs.push
        run: |
          helm push "dist/buildkit-${{ inputs.version }}.tgz" oci://ghcr.io/builderhub

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-buildkit-${{ inputs.version }}
          path: dist/buildkit-${{ inputs.version }}.tgz
