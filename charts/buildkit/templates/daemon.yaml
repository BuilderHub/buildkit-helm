{{- range .Values.daemons }}
{{- if .enabled }}
{{- $mode := .mode }}
{{- if eq $mode "pod" }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "buildkit.daemonFullname" (list $ .) }}
  labels:
    {{- include "buildkit.labels" (list $ .) | nindent 4 }}
  {{- with .podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "buildkit.podTemplate" (list $ . "pod") | nindent 2 }}
  restartPolicy: Always
{{- else if eq $mode "daemon" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "buildkit.daemonFullname" (list $ .) }}
  labels:
    {{- include "buildkit.labels" (list $ .) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "buildkit.selectorLabels" (list $ .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buildkit.labels" (list $ .) | nindent 8 }}
      {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "buildkit.podTemplate" (list $ . "daemon") | nindent 6 }}
{{- else if eq $mode "statefulset" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "buildkit.daemonFullname" (list $ .) }}
  labels:
    {{- include "buildkit.labels" (list $ .) | nindent 4 }}
spec:
  serviceName: {{ include "buildkit.daemonFullname" (list $ .) }}
  replicas: {{ .replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "buildkit.selectorLabels" (list $ .) | nindent 6 }}
  {{- if eq .storage.type "pvc" }}
  volumeClaimTemplates:
    {{- include "buildkit.volumeClaimTemplates" (list $ .) | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "buildkit.labels" (list $ .) | nindent 8 }}
      {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "buildkit.podTemplate" (list $ . "statefulset") | nindent 6 }}
{{- else }}
{{- fail (printf "daemon %s: unsupported mode %q (use pod, daemon, or statefulset)" .name .mode) }}
{{- end }}
{{- end }}
{{- end }}
